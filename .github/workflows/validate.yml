name: Validate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  style:
    name: Style (tabs + localisation BOM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only lines ADDED by this change are checked. About 42% of the PDX files
      # in this repo predate the tab convention, so a whole-tree gate would fail
      # on every pull request forever. See tools/check_style.py for the rationale.
      - name: Determine base revision
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check style on changed lines
        run: |
          BASE="${{ steps.base.outputs.sha }}"
          # A zero SHA means a new branch with no previous state to diff against.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base revision to diff against; skipping incremental style check."
            exit 0
          fi
          python3 tools/check_style.py --diff "$BASE"

      - name: Whole-tree debt report (informational)
        if: always()
        run: python3 tools/check_style.py --all

  localisation:
    name: Localisation audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Verifies that every event title/desc/option key in the Southeast Asia
      # theatres resolves against localisation/english/. Passes today, so it is
      # a real gate rather than a placeholder.
      - name: Audit Southeast Asia localisation
        run: python3 tools/loc_audit.py --check

  encoding:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # descriptor.mod carries a developer-local absolute path on the `path=`
      # line. Everything else in the mod must stay path-independent.
      - name: Check for hardcoded absolute paths in script
        run: |
          set +e
          hits=$(grep -rIlnE '(^|[^A-Za-z])[A-Za-z]:[\\/]{1,2}(Users|Github|Documents)' \
            --include="*.txt" --include="*.gui" --include="*.gfx" --include="*.asset" \
            "Cold War Iron Curtain" \
            | grep -v "descriptor.mod")
          if [ -n "$hits" ]; then
            echo "Hardcoded absolute paths found in script files:"
            echo "$hits"
            exit 1
          fi
          echo "No hardcoded absolute paths in script files."
